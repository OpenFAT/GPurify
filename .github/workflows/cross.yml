# Every release target, compiled and not run: a foreign binary cannot run on
# this runner, but a platform break shows here before a release meets it.
name: cross

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: cross-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-gnu.2.28, aarch64-linux-gnu.2.28, x86_64-macos, aarch64-macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: omarsiwy
          skipPush: true
      - name: Build every artifact for ${{ matrix.target }}
        run: >
          nix develop -c zig build -Dtarget=${{ matrix.target }}
          -Doptimize=ReleaseSafe -Dgpu=false --summary failures --prefix out
