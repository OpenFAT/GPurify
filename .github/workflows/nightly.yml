name: nightly

# The slow tier: evidence the merge gate cannot afford.
#
#   slow         every suite in ReleaseSafe with the slow field solves on
#   fuzz         the ten std.testing.fuzz targets (tests/gpurify/fuzz.zig),
#                bounded by iterations; a crash is saved under .zig-cache/f
#                and uploaded, to be minimised into tests/fuzz/regressions
#   determinism  every corpus case through the CLI at 1 thread and 8,
#                byte-compared (the golden suite already runs each twice
#                and re-runs every field solve on one thread)
#
# One job, so the steps share one compile. Every step runs even when an
# earlier one fails, so one red check does not hide the others.
# GitHub disables a schedule after 60 days without repository activity:
# run it by hand before then, or accept that it stops.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FLAGS: -Doptimize=ReleaseSafe -Dgpu=false -Dcuda-arch=none -Dhip-arch=none --summary failures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: omarsiwy
          skipPush: true

      - name: Every suite, slow tests on
        run: nix develop -c zig build test -Dslow-tests=true $FLAGS

      # Coverage-guided fuzzing, bounded by iterations. `--fuzz=N` runs the
      # suite first, then fuzzes (20K took 11 min locally in ReleaseSafe);
      # the build's exit code does not carry a fuzz crash, so the saved
      # input decides.
      - name: Fuzz
        if: ${{ !cancelled() }}
        run: |
          nix develop -c zig build test-gpurify --fuzz=100K -Dtest-filter=fuzz $FLAGS 2>&1 | tee fuzz.txt
          status="${PIPESTATUS[0]}"
          if [ -e .zig-cache/f/crash ]; then echo "fuzz crash: .zig-cache/f/crash"; exit 1; fi
          exit "$status"

      - name: Determinism, 1 thread against 8
        if: ${{ !cancelled() }}
        run: |
          nix develop -c zig build $FLAGS --prefix out
          status=0
          for gds in tests/fixtures/{drc,erc,pex}/*.gds; do
            for t in 1 8; do
              out/bin/gpurify all "$gds" --deck tests/fixtures/params.deck --format json --threads $t > "t$t.txt" 2>&1; echo "exit $?" >> "t$t.txt"
            done
            cmp -s t1.txt t8.txt || { echo "differs at 1 and 8 threads: $gds"; status=1; }
          done
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: nightly-fuzz
          path: |
            fuzz.txt
            .zig-cache/f/crash
          if-no-files-found: ignore
